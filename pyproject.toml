[project]
name = "mia-evals"
version = "0.0.1"
description = "Scoring and leaderboards for volumetric instance and semantic segmentation"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "third_party_licenses/banis-MIT.txt"]
dependencies = [
    "numpy>=1.24",
    "zarr>=3.0",
    "miao-io>=0.3.0",
    "numba>=0.59",        # compiles the connected-components and mutex-watershed kernels
    "networkx>=3.0",      # skeleton graph handling, for `skeleton_erl`
    "tqdm>=4.0",          # progress on the long skeleton scoring loops
    "pillow>=9.0",        # writes the comparison figures
]

[project.scripts]
mia-evals = "evaluate:main"
mia-evals-viz-affinities = "viz.affinities:main"
mia-evals-viz-segmentation = "viz.segmentation:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.4",
    "mypy>=1.8",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools]
py-modules = ["artifact", "components", "config", "evaluate", "registry"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
    "unit: fast single-process CPU tests",
    "parity: reproduces a recorded published-baseline number; needs `funlib.evaluate`",
    "slow: needs a real volume or a real checkpoint",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
exclude = [
    "src/utils/connected_components.py",
    "src/utils/instance_metrics.py",
]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
files = ["src", "tests"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["utils.connected_components", "utils.instance_metrics"]
ignore_errors = true

[[tool.mypy.overrides]]
module = ["zarr.*"]
follow_imports = "skip"
