# lmd_ssl_v1 -- the HELD-OUT half of the lmd instance-segmentation eval set: scored once, as `--test`; the arms never trained on these.
#
# Copied on 2026-09-14 from mia-train's experiments/lmd_ssl_v1/lmd_val_singlescale.yaml, which
# make_splits.py generated from
#   /groups/miaai/miaai/lmd-v0.0.1/configs/evals/v1/instance_seg/lmd_instance_seg_eval_singlescale_patch256.yaml
# The volumes must stay exactly these: the two halves define what "held out" means for every
# recorded lmd_ssl_v1 score. The complementary half is fit.yaml (in this directory).
#
# Read on both sides of the artifact boundary. mia-train's predict.py predicts every volume in it
# (`--data-config configs/lmd_ssl_v1_neuron_instance/data/test.yaml --out <artifacts>/...`), and the lmd_ssl_v1 scoring configs
# score those predictions against it. 4 volumes, one per modality pair, equally weighted. Every entry
# keeps the bounding box measured from its label's non-zero extent -- LICONN DG and hippocampus have
# 0% GT in their own central 256^3 block, so dropping the box would predict and score unannotated
# space.
#
#   kasthuri15_ac4
#   zebrafish_fish2_doublecube1
#   liconn_mouse_hippocampus
#   liconn_expid82

resolutions:
- - 8.0
  - 8.0
  - 8.0
patch_size:
- 256
- 256
- 256
output_axes: lcxyz
samples_per_epoch: 1000

volumes:
- name: kasthuri15_ac4
  path: /groups/miaai/miaai/lmd-v0.0.1/data/em-mouse-Kasthuri15-ac3ac4-cortex/crop-002_ac4_100slices.zarr
