# NISB "base": the validation cube (seed100), as a miao data config.
#
# Separate from the test cube on purpose. Under the benchmark's rules the val cube is where
# post-processing thresholds are chosen and the test cube is scored once, so a task file names one
# or the other and never both -- which is what `mia-evals score --val ... --test ...` consumes.
#
# Lives here rather than in the generated lmd-configs tree because NISB is not part of that corpus:
# it sits under `dev/nisb`, and the generated eval configs do not include it. Corpus volumes are
# referenced from their generated config instead; see configs/tasks/.
#
# The skeleton this cube is scored against is *inside* the zarr group (`seed100.zarr/skeleton.pkl`),
# not beside it. Scoring reads level 0 directly over the region the artifact covers and uses none
# of `resolutions`, `patch_size`, `output_axes` or `bounding_box`; they are here because this same
# file is what mia-train's `src/predict.py` predicts from, and there they matter: 9x9x20 nm is the
# native s0 resolution (no resampling, so the artifact's `origin` is a cube coordinate), 256 is the
# patch every NISB run trained at, and `bounding_box` -- required by `predict.py` -- is the whole
# cube, because NISB is annotated throughout. A block of it is chosen at prediction time with
# `--origin`/`--size`, never by shrinking this box: the box states the annotation, and a prediction
# that fills a shrunken one would be recorded as covering the whole cube.

resolutions:
- - 9.0
  - 9.0
  - 20.0
patch_size:
- 256
- 256
- 256
output_axes: lcxyz

volumes:
- name: nisb_base_val_seed100
  path: /groups/miaai/miaai/lmd-v0.0.1/dev/nisb/base/val/seed100.zarr
  image_key: raw
  label_key: labels/public_gt-cell-nisb
  zarr_version: zarr3
  bounding_box: [[0, 3000], [0, 3000], [0, 1350]]   # the whole cube, x y z, s0 voxels
