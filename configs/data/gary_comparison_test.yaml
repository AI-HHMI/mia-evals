# gary_comparison -- the TEST corner of the hemibrain Ellipsoid Body crop: scored once, as [data.test].
#
# Copied on 2026-09-18 from mia-train's experiments/gary_comparison/data/hemibrain_eb_test.yaml (the
# volume entry is byte-identical; keep it so). The box is the colleague's test box, [4000, 5000)^3 in
# level-0 voxels (x, y, z order, the store's own). Read on both sides of the artifact boundary:
# mia-train's predict.py predicts it (`--data-config configs/data/gary_comparison_test.yaml`) and the
# gary_comparison scoring configs score the prediction against it.
#
# The scored region is the largest lattice-aligned sub-box of this box: at patch 256 with the
# half-window stride that is 896^3 = [4052, 4948)^3, 71.9% of the colleague's test voxels. His
# number on the full 1000^3 is therefore on a superset of ours; see mia-train's
# experiments/gary_comparison/README.md, "Scoring the test corner".
#
# Every training and validation crop lay in z < 4000 or outside x, y >= 4000, so nothing here was
# seen in training or used for model selection.

resolutions: [[8.0, 8.0, 8.0]]
patch_size: [256, 256, 256]
output_axes: lcxyz
samples_per_epoch: 1000   # the run config's [data] / [val_data] section overrides this
# Resampling and normalisation happen on the device, not in the loader workers (see
# src/data/miao_dataset.py). Here as well as in the run config so the setting cannot be lost.
defer_image_ops: true   # irrelevant for scoring; kept identical to the training-side file

volumes:
  - name: hemibrain_eb_test
    path: /groups/miaai/miaai/lmd-v0.0.1/data/em-drosophila-flyem-hemibrain/crop-001_EllipsoidBody_x24000_y23000_z17000.zarr
    image_key: raw
    label_key: labels/proofread-cell-hemibrain-v1.2
    zarr_version: zarr3
    bounding_box: [[4000, 5000], [4000, 5000], [4000, 5000]]
    weight: 1.0
    normalize: true   # uint8 on disk, so this maps to [0, 1] by dtype max
