# lmd_ssl_v1 -- the FINETUNE half of the lmd instance-segmentation eval set: the arms were finetuned on these, and the post-processing is fitted on them, as `--val`.
#
# Copied on 2026-09-14 from mia-train's experiments/lmd_ssl_v1/lmd_finetune_singlescale.yaml, which
# make_splits.py generated from
#   /groups/miaai/miaai/lmd-v0.0.1/configs/evals/v1/instance_seg/lmd_instance_seg_eval_singlescale_patch256.yaml
# The volumes must stay exactly these: the two halves define what "held out" means for every
# recorded lmd_ssl_v1 score. The complementary half is lmd_ssl_v1_test.yaml.
#
# Read on both sides of the artifact boundary. mia-train's predict.py predicts every volume in it
# (`--data-config configs/data/lmd_ssl_v1_finetune.yaml --out <artifacts>/...`), and the lmd_ssl_v1 task files
# score those predictions against it. 4 volumes, one per modality pair, equally weighted. Every entry
# keeps the bounding box measured from its label's non-zero extent -- LICONN DG and hippocampus have
# 0% GT in their own central 256^3 block, so dropping the box would predict and score unannotated
# space.
#
#   kasthuri15_ac3
#   zebrafish_fish2_quadcube1
#   liconn_mouse_dg
#   hemibrain_ellipsoid_body

resolutions:
- - 8.0
  - 8.0
  - 8.0
patch_size:
- 256
- 256
- 256
output_axes: lcxyz
samples_per_epoch: 1000

volumes:
- name: kasthuri15_ac3
  path: /groups/miaai/miaai/lmd-v0.0.1/data/em-mouse-Kasthuri15-ac3ac4-cortex/crop-001_ac3_100slices.zarr
