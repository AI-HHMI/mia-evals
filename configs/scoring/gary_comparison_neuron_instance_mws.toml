# gary_comparison -- neuron instance segmentation on the colleague's test corner of the hemibrain
# Ellipsoid Body crop, from affinities through MUTEX WATERSHED and a size filter.
#
#   mia-evals score configs/scoring/gary_comparison_neuron_instance_mws.toml \
#       --test <artifacts>/test --val <artifacts>/fit --run-dir <mia-train run dir>
#
# The route the lmd_ssl_v1 arms were best under (MWS labelling + size filter), run here in one go
# rather than from a stored labelling: at 896^3 the watershed is ~4 G edges and ~2 h in memory, and
# the `mws` post-processor now computes it ONCE per volume and sweeps `min_sizes` on top, so the
# whole scoring is a single CPU job of a few hours (32 slots; the edge arrays alone are ~90 GB).
# Same task as `gary_comparison_neuron_instance.toml` (the cc_threshold baseline); the two routes
# land in one table, with `route` telling them apart in the record name.

task_name = "gary_comparison_neuron_instance"
route = "mws"

notes = """
One volume, one test block: the colleague's [4000, 5000)^3 corner of the hemibrain Ellipsoid Body
crop, scored on its lattice-aligned 896^3 centre. Voxel metrics, not skeleton ones (dense labels,
no skeletons): panoptic quality ranks; VOI split/merge, SQ, RQ and adapted Rand error are reported.

Post-processing is fitted on a 1000^3 block of the validation slab directly beneath the test
corner (gary_comparison_fit.yaml), never on the test block. Models trained on lmd_ssl_v1's finetune
set saw this volume's central 1024^3, which lies in the train and validation slabs, not in the test
corner, so they may be scored here as well.
"""

[data.test]
config_path = "../data/gary_comparison_test.yaml"

[data.fit]
config_path = "../data/gary_comparison_fit.yaml"

[task]
name = "instance_seg"
truth_kind = "instances_resampled"   # <volume>.gt.zarr beside each prediction, written by mia-train's predict.py

[postprocess]
name = "mws"
# Stride 1 keeps every long-range (repulsive) edge; 2 and 4 discarded 8x/64x of them and cost the
# lmd measurements most of their accuracy (src/postprocess/mws.py), so they are not swept.
repulsive_strides = [1]
# The knob that decides pq on this kind of data: pq counts every surviving speck as a false
# positive, so on lmd_ssl_v1 the filter moved mean pq 0.004 -> 0.344 while VOI barely moved. Both
# are reported. Fitted on the fit block, applied once to the test block.
min_sizes = [0, 500, 5000, 20000, 50000]

[metric]
names = ["voxel_instance"]
rank_by = "voxel_instance"        # primary key: pq
