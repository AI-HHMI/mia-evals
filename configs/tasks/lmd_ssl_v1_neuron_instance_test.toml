# lmd_ssl_v1 -- neuron/cell instance segmentation on the HELD-OUT half of the eval set.
#
# The reported split of mia-train's `experiments/lmd_ssl_v1`: that experiment finetunes on four of
# the eight instance-segmentation eval volumes and validates on the other four, one from each
# modality pair. This task is the four it never trained on.
#
# Fit the postprocessing threshold on the other half and report here:
#
#   python src/evaluate.py score configs/tasks/lmd_ssl_v1_neuron_instance_test.toml \
#       --test  <artifacts>/test  \
#       --val   <artifacts>/fit   \
#       --val-config configs/tasks/lmd_ssl_v1_neuron_instance_fit.toml \
#       --run-dir /nrs/.../lmd1__2c_dinov3_lvd_ft_subpixel_20260824_183919
#
# The experiment's README is explicit about why: with only 8 volumes the validation half does
# double duty as model selection and reported score, so a threshold chosen here would be selecting
# on the number being published. The runner refuses to fit and report on the same volumes.
#
# `config_path` points into the mia-train checkout because that YAML *is* the split -- generated by
# `experiments/lmd_ssl_v1/make_splits.py` from the corpus' own generated eval config. Copying it
# here would create a second definition that can drift from the one the model trained against.

task_name = "lmd_ssl_v1_neuron_instance"

notes = """
Voxel metrics, not skeleton ones: these volumes ship dense label arrays and no skeletons, so nERL
is unavailable and panoptic quality ranks. Not comparable with any NISB nERL figure.

Scored region per volume is the largest lattice-aligned sub-box of each volume's bounding box (see
mia-train's src/predict_ngff.py), which is smaller than the box itself. Every entry on this task is
scored the same way, so entries compare to each other; they do not compare to a whole-box number.
"""

[data]
config_path = "/groups/scicompsoft/home/orhane/projects/mia-train/experiments/lmd_ssl_v1/lmd_val_singlescale.yaml"

[task]
name = "instance_seg"
truth_kind = "sibling_artifact"   # <volume>.gt.zarr beside each prediction; see predict_ngff.py

[postprocess]
name = "cc_threshold"
# Wider than BANIS' [3..7]. Those five logits are thresholds 0.646 to 0.802, calibrated for a
# BANIS-trained model on NISB, and measured on arm 2 the entire threshold response lies below
# them: at logit +3 a 256^3 block already yields 1,342 components against 34 ground-truth
# objects, and it climbs to 24,660 by logit +16. A sweep that cannot reach the optimum is not a
# fit, it is a fixed threshold with extra steps.
#
# Costs 2.4x the scoring time of the five-logit sweep (~3 min per call on the zebrafish cube),
# which is worth it to stop the fitted value from sitting at the edge of its own range.
logits = [-12, -9, -6, -3, 0, 3, 6, 9, 12]

[metric]
names = ["voxel_instance"]
rank_by = "voxel_instance"        # primary key: pq
