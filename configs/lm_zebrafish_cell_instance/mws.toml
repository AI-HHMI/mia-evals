# lm_zebrafish_cell_instance -- cell instance segmentation in one frame of a light-sheet zebrafish time
# series, from affinities through MUTEX WATERSHED and a size filter. Reported on frame 10 ([data.test]),
# fitted on frames 1 and 25 of the same store ([data.fit]).
#
#   python src/predict.py <run_dir> --data-config <mia-evals>/configs/lm_zebrafish_cell_instance/data/test.yaml \
#       --out <artifacts>/test --cover-box
#   python src/predict.py <run_dir> --data-config <mia-evals>/configs/lm_zebrafish_cell_instance/data/fit.yaml \
#       --out <artifacts>/fit --cover-box
#   mia-evals score configs/lm_zebrafish_cell_instance/mws.toml \
#       --test <artifacts>/test --val <artifacts>/fit --run-dir <run_dir>
#
# Predict with --cover-box. The first record fixes the region scored in each frame, which otherwise
# follows from a model's tiling (its window and the half-window stride); with the tiles reaching the
# box faces, every model scores the whole frame whatever its window, so all rows share one region.
#
# Each frame is 113 M voxels, so the watershed is minutes per frame and the whole scoring one small
# CPU job.

task_name = "lm_zebrafish_cell_instance"
route = "mws"

notes = """
Voxel metrics on dense labels: panoptic quality ranks; VOI split/merge, SQ, RQ and adapted Rand
error are reported. One frame of a 48-frame light-sheet time series (Betzig lab, zebrafish 24 hpf,
200 x 108 x 108 nm voxels, 152 x 508 x 1466 per frame): frame 10 is reported (293 proofread cells),
frames 1 and 25 fit the size filter. Both splits are the same specimen and field of view, so this
measures generalisation across time, not across specimens; copying frame 25's labels as frame 10's
prediction scores pq 0.115. Two annotators agree at pq 0.736 on a 152 x 200 x 200 sub-crop of
frame 10. About a fifth of each frame, chiefly the lower left, was left unannotated on purpose and
is scored as background, so pq counts any cell predicted there as a false positive.
"""

[data.test]
config_path = "data/test.yaml"      # frame 10

[data.fit]
config_path = "data/fit.yaml"       # frames 1 and 25

[task]
name = "instance_seg"
truth_kind = "instances"   # read from the store at the pinned frame; predictions are at native resolution

[postprocess]
name = "mws"
# Stride 1 keeps every long-range (repulsive) edge; coarser strides cost the lmd measurements most of
# their accuracy (src/postprocess/mws.py), so they are not swept.
repulsive_strides = [1]
# pq counts every surviving speck as a false positive, so the size filter is the knob that decides it.
# Ground-truth cells are a median 206-259 k voxels per frame, but the smallest 5% are only 8-16 k:
# slivers of cells cut by the volume faces, which hold nearly every cell (272 of 293 in frame 10). The
# candidates run from no filter past that 5th percentile, so the fitted value has candidates on both
# sides of it.
min_sizes = [0, 500, 2000, 5000, 10000, 20000, 50000]

[metric]
names = ["voxel_instance"]
rank_by = "voxel_instance"        # primary key: pq
