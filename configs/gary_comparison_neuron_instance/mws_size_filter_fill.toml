# gary_comparison -- the `mws_size_filter` route plus Gary's "dilate after": the same mutex watershed and size filter,
# then the surviving segments grown back into the holes the filter leaves (`fill_distances`), swept
# jointly with `min_sizes` on the fit block and applied once to the test block.
#
#   mia-evals score configs/gary_comparison_neuron_instance/mws_size_filter_fill.toml \
#       --test <artifacts>/test --val <artifacts>/fit --run-dir <mia-train run dir>
#
# Every hole voxel within `fill_distance` voxels (Euclidean) of a segment takes its nearest segment's
# label; "all" fills every hole. Meant first for models trained on eroded labels (gary_comparison arm
# 6a), whose predicted 2-voxel gaps between neurons become specks the size filter deletes. Distance 0
# is in the sweep, so the fit can always choose plain `mws`; "all" is the colleague's literal "fill in
# any empty space", which on arm 1c's unfilled holes flooded true background and LOWERED pq
# (0.1665 -> 0.1589; mia-train-experiments/gary_comparison/probes/fill_holes). Records land as
# `<run>.step<N>.mws_size_filter_fill`, beside the `.mws_size_filter` ones. Four distances x five sizes is 20 fit
# candidates and one distance transform per size, so this job runs longer than `mws_size_filter.toml`'s.
#
# What follows is mws_size_filter.toml, unchanged but for `fill_distances`.
#
# gary_comparison -- neuron instance segmentation on the test corner of the hemibrain
# Ellipsoid Body crop, from affinities through MUTEX WATERSHED and a size filter.
#
#   mia-evals score configs/gary_comparison_neuron_instance/mws_size_filter.toml \
#       --test <artifacts>/test --val <artifacts>/fit --run-dir <mia-train run dir>
#
# The route the lmd_ssl_v1 arms were best under (MWS labelling + size filter), run here in one go
# rather than from a stored labelling: at 896^3 the watershed is 4.3 G edges and about 20 minutes on
# the compiled kernel (2.5 h on the Python reference before 2026-09-23), and the `mws` post-processor
# computes it ONCE per volume and sweeps `min_sizes` on top, so the whole scoring is a single CPU job
# of about an hour (peak ~200 GB; give it a whole node, a neighbouring job slows it several-fold).
# Same task as `cc_threshold_size_filter.toml` beside it (the baseline); the two routes
# land in one table, with the file name telling them apart in the record name.

task_name = "gary_comparison_neuron_instance"

notes = """
One volume, one test block: the [4000, 5000)^3 corner of the hemibrain Ellipsoid Body
crop, scored on its lattice-aligned 896^3 centre. Voxel metrics, not skeleton ones (dense labels,
no skeletons): panoptic quality ranks; VOI split/merge, SQ, RQ and adapted Rand error are reported.

Post-processing is fitted on a 1000^3 block of the validation slab directly beneath the test
corner (data/fit.yaml), never on the test block. Models trained on lmd_ssl_v1's finetune
set saw this volume's central 1024^3, which lies in the train and validation slabs, not in the test
corner, so they may be scored here as well.
"""

[data.test]
config_path = "data/test.yaml"

[data.fit]
config_path = "data/fit.yaml"

[task]
name = "instance_seg"
truth_kind = "instances_resampled"   # <volume>.gt.zarr beside each prediction, written by mia-train's predict.py

[postprocess]
name = "mws"
# Stride 1 keeps every long-range (repulsive) edge; 2 and 4 discarded 8x/64x of them and cost the
# lmd measurements most of their accuracy (src/postprocess/mws.py), so they are not swept.
repulsive_strides = [1]
# The knob that decides pq on this kind of data: pq counts every surviving speck as a false
# positive, so on lmd_ssl_v1 the filter moved mean pq 0.004 -> 0.344 while VOI barely moved. Both
# are reported. Fitted on the fit block, applied once to the test block.
min_sizes = [0, 500, 5000, 20000, 50000]
# Grow the survivors back into the filter's holes, fitted jointly with min_sizes (header).
fill_distances = [0, 1, 2, "all"]

[metric]
names = ["voxel_instance"]
rank_by = "voxel_instance"        # primary key: pq
