# zebrafinch_neurite_tracing -- the 12 validation skeletons in the same benchmark region, as [data.fit].
#
# Same store and box as test.yaml, different neurons: the LSD authors chose every method's thresholds on these
# (Supplementary Note D.4). That departs from mia-evals' rule that a fit split is a different region -- the
# voxels are shared, the ground truth is not -- and it is the published protocol. A --val artifact is therefore
# the --test prediction itself, under this volume's name (a symlink). Ground truth:
# skeletons/zebrafinch_benchmark_val.pkl (346 pieces, 44,031 nodes, 10.65 mm; perfect ERL 230.55 um).
# Nothing is fitted while every route of this task has a single candidate.

resolutions: [[20.0, 9.0, 9.0]]
patch_size: [128, 256, 256]   # read by mia-train's predict.py, which requires the model's own: set it first
output_axes: lczyx
samples_per_epoch: 1000
defer_image_ops: true   # irrelevant for scoring; kept so the rule holds for every miao config

volumes:
  - name: zebrafinch_benchmark_val
    path: /groups/miaai/miaai/mia-evals-data/zebrafinch_j0126/zebrafinch_j0126.zarr
    image_key: raw
    zarr_version: zarr2
    bounding_box: [[200, 5500], [800, 10100], [500, 10200]]
    weight: 1.0
    normalize: true   # uint8 on disk, so this maps to [0, 1] by dtype max
