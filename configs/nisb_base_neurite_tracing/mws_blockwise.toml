# nisb_base_neurite_tracing from a model's affinities, through blockwise mutex watershed.
#
#   mia-evals score configs/nisb_base_neurite_tracing/mws_blockwise.toml --test <affinities> --val <affinities> \
#       --scratch <dir>
#
# A cube is 12.2 G voxels, past what exact mutex watershed holds in one process, so the watershed runs in blocks
# (src/postprocess/mws_blockwise.py; docs/neurite_tracing.md has how far that moves the result from exact). The
# scorer builds each labelling under <scratch>/mws_blockwise/ when it first needs it; the per-block stage can run on
# an LSF array beforehand (python -m postprocess.mws_blockwise ... --worker/--workers). NISB is annotated
# throughout, so no mask. The affinities must cover the whole cube (mia-train's predict.py --cover-box): the box is the
# cube, as the benchmark scores it.
# One candidate, so nothing is fitted; [data.fit] is the task's own declaration.

task_name = "nisb_base_neurite_tracing"

[data.test]
config_path = "data/test.yaml"

[data.fit]
config_path = "data/fit.yaml"

[task]
name = "instance_seg"
truth_kind = "skeleton"
skeleton_name = "skeleton.pkl"   # inside each volume's store (the data YAML's `path`), as NISB ships it

[postprocess]
name = "mws_blockwise"
block = [512, 512, 256]         # x, y, z: about 4.6 x 4.6 x 5.1 um, ~20 GB per process
processes = 8                   # pool for the parts the scorer runs itself; give the job 32 slots

[metric]
names = ["skeleton_erl"]
rank_by = "skeleton_erl"
