# nisb_base_neurite_tracing -- the TEST split: NISB's base test cube (seed101), reported as [data.test].
#
# NISB (the Neuron Instance Segmentation Benchmark) is synthetic: every cube is generated by one fixed procedure, at
# 9 x 9 x 20 nm, 3000 x 3000 x 1350 voxels (27 x 27 x 27 um, 12.2 G voxels). The ground truth is the cube's own
# skeleton.pkl, written by the generator (networkx; `id` = the neuron, `index_position` = x, y, z voxel of raw/s0),
# so no segmenter's boundaries are built into it. The benchmark's rules: train on the training cubes only, choose
# hyperparameters and post-processing on the val cube (fit.yaml), score the test cube once.
#
# The box is the whole cube, as the benchmark scores it (and as every NISB number in mia-train's experiments was
# measured): predict it with mia-train's `predict.py --cover-box`, which covers the whole cube -- without it the tiles stop
# short of the faces. The store is x, y, z -- output_axes lcxyz, as in mia-train's configs/data/nisb_base.yaml -- and the
# skeleton counts the same axes.

resolutions: [[9.0, 9.0, 20.0]]
patch_size: [256, 256, 256]   # read by mia-train's predict.py, which requires the model's own: set it first
output_axes: lcxyz
samples_per_epoch: 1000
defer_image_ops: true   # irrelevant for scoring; kept so the rule holds for every miao config

volumes:
  - name: nisb_base_seed101
    path: /groups/miaai/miaai/lmd-v0.0.1/dev/nisb/base/test/seed101.zarr
    image_key: raw
    zarr_version: zarr3
    bounding_box: [[0, 3000], [0, 3000], [0, 1350]]
    weight: 1.0
    normalize: true   # uint8 on disk, so this maps to [0, 1] by dtype max
