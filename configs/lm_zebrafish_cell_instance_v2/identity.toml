# lm_zebrafish_cell_instance_v2 from finished segmentations of the three test frames, scored exactly as submitted.
#
# For labellings made without affinities -- another tool's cells, a hand segmentation: no watershed
# and no size filter, hence no fit split. Each artifact is an `instances` labelling of one whole frame
# on its store's own grid, named after its volume: lm_zebrafish_t10.zarr (152 x 508 x 1466, z, y, x),
# lm_zebrafish_roi1_c001_t05.zarr and lm_zebrafish_fish3_c010_t01.zarr (3328 x 384 x 128, x, y, z as
# stored today; 128 x 384 x 3328, z, y, x once the stores are re-ordered, see data/test.yaml). Their
# attrs name the producer (`run`, `step`) as every record's must. The mws_size_filter route scores the
# whole frames, and the first record fixes the region for every route of the task, so a labelling must
# cover all of each frame.
# Declaring `source_path` and `source_fixed_axes` (`{t: 10}`, `{t: 5}`, `{t: 1}`) lets the scorer refuse a
# labelling of another frame; without them it is taken at its word.
#
#   mia-evals score configs/lm_zebrafish_cell_instance_v2/identity.toml --test <labellings>

task_name = "lm_zebrafish_cell_instance_v2"

[data]
config_path = "data/test.yaml"      # the three test frames, the volumes the mws route reports

[task]
name = "instance_seg"
truth_kind = "instances"   # read from the store at the pinned frame

[postprocess]
name = "identity"

[metric]
names = ["voxel_instance"]
rank_by = "voxel_instance"        # primary key: pq
