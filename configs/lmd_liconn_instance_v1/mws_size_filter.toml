# lmd_liconn_instance_v1 -- instance segmentation on LICONN volumes only (class cell, plus one neuron label), from affinities through EXACT
# mutex watershed and a size filter: fitted on the fit half ([data.fit]), applied once to the held-out half ([data.test]).
#
#   mia-evals score configs/lmd_liconn_instance_v1/mws_size_filter.toml \
#       --test <artifacts>/test --val <artifacts>/fit --run-dir <mia-train run dir> --scratch <dir>
#
# Exact rather than blockwise mws: the largest box (ExPID82, 1024 x 1024 x 534 image voxels) is small enough for one node.

task_name = "lmd_liconn_instance_v1"

notes = """
Voxel metrics, not skeleton ones: these volumes ship dense label arrays and no skeletons, so panoptic
quality ranks. LICONN only (mouse and Drosophila expansion microscopy; eight class cell labels and one class neuron label); not comparable with
lmd_neuron_instance_v1 or _v2, which score other volume sets on other splits.

Nine volumes: fit = liconn_mouse_dg, flyid49_40xw005, liconn_mouse_cortex_subbox, flyid49_40xw005_neuron;
test = liconn_mouse_hippocampus, liconn_expid82, flyid49_40xw006, liconn_expid82_jj, phdye19_opticlobes_final.
Volumes on one raw crop or store sit on one side (flyid49_40xw005 and its neuron label on fit; the two
ExPID82 boxes on test). flyid49_40xw005_neuron is the proofread output of an LSD/watershed prediction,
so its ground truth inherits that pipeline's boundaries. Single scale, 8 nm; the boxes are 2.3-9.9 um across.

Scored region per volume is mia-train predict.py's lattice-aligned sub-box of the volume's measured
bounding box, at 8 nm.
"""

[data.test]
config_path = "data/test.yaml"

[data.fit]
config_path = "data/fit.yaml"

[task]
name = "instance_seg"
truth_kind = "instances_resampled"   # <volume>.gt.zarr beside each prediction, written by mia-train's predict.py

[postprocess]
name = "mws"
repulsive_strides = [1]
# Mean object size at 8 nm, estimated from box volume x foreground / ids: ~5e4 voxels (flyid49_40xw005_neuron) to
# ~1e6 (liconn_mouse_dg), ~2e5-6e5 for most. v2's list stopped at 6e5, below the DG mean, so 1.2e6 is added: a fitted
# value at the edge of the list is not a fitted value.
min_sizes = [0, 500, 5000, 20000, 50000, 150000, 300000, 600000, 1200000]

[metric]
names = ["voxel_instance"]
rank_by = "voxel_instance"        # primary key: pq
